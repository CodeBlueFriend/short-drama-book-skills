schema_version: 1
promotion_budget: 8
bundle_id: bundle.mckee-story-short-drama
book:
  title: 故事：材质、结构、风格和银幕剧作的原理
  author: 罗伯特·麦基；周铁东译
  source_pack: mckee-story-short-drama
  baseline_tag: tj2014-zh-v0.2
entry:
  name: mckee-story-short-drama
  description: 依据天津人民出版社2014年、周铁东译《故事》的中文方法段落，指导短剧策划、人物、结构、分集、场景、对白及改编，检查行动因果、信息分配和结尾回收。用于用户要求采用麦基原理或排查具体剧本问题时。
  core_principles:
  - 先读取当前阶段的项目事实，再按任务查卡
  - 用人物欲望、行动、对抗与后果核验改写
  - 保留中文章节、小节和电子段号
  - 结合项目条件使用原书的形式与比例建议
  out_of_scope:
  - 纯书目查询
  - 独立的医疗或司法专业判断
  - 与原书无关的软件任务
  stop_conditions:
  - 必要情节事实或原作素材缺失时列出缺口
  - 相互矛盾的锁定事实影响改写时先标注冲突
router_entry:
