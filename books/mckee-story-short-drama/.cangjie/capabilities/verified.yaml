bundle_id: bundle.mckee-story-short-drama
book:
  title: 故事
  source_pack: mckee-story-short-drama
entry:
  name: mckee-story-short-drama
  description: 用罗伯特·麦基《故事》的英文方法段落设计或检查短剧的激励事件、行动鸿沟、递进纠葛、场景节拍、危机选择与高潮铺垫。
  core_principles:
  - 用具体行动和后果核验因果
  - 保留原书章节和英文页码
  - 把项目锁定事实带入改写检查
  out_of_scope:
  - 未核对章节的全书解读
  stop_conditions:
  - 必要剧情事实缺失时列待定字段
