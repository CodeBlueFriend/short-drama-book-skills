  revision: 2
  status: active
  slug: expectation-gap
  title: 用预期与结果的鸿沟推动下一步
  importance: high
  importance_rationale: 短剧场景任务需要可执行步骤，源方法段与交付契约已逐项核对。
  intents:
  - 用预期与结果的鸿沟推动下一步
  keywords:
  - expectation-gap
  - 场景
  - 第一步；鸿沟；关于风险；进展过程中的鸿沟
  one_liner: 修改一场行动戏时，分别写出主角的目标、他预期的反应和实际结果，再由结果确定下一步行动。实际结果与预期相同时，检查这场戏是否还承担了必要的关系变化。
